name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: triad_dms
      TEST_MONGO_URI: mongodb://localhost:27017
      RATELIMIT_STORAGE_URI: mongodb://localhost:27017
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin@12345
      ALLOW_ANONYMOUS_UPLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Start the API server
        run: |
          python -m app.seed
          gunicorn --bind 0.0.0.0:5000 --workers 2 --daemon --pid gunicorn.pid \
            --error-logfile gunicorn.log --access-logfile gunicorn.log 'app:create_app()'
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:5000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy" && cat gunicorn.log && exit 1

      - name: Run the evaluators' test script
        run: |
          python test_api.py
          cat test_report.txt
          # test_api.py always exits 0, so read the result from its report.
          grep -qx "Failed: 0" test_report.txt

      - name: Run the extended evaluator-style tests
        run: |
          python test_api_extended.py || (cat test_report_extended.txt && exit 1)
          cat test_report_extended.txt

      - name: Show server log on failure
        if: failure()
        run: cat gunicorn.log || true
