server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads go up to 25 MB; leave headroom for the multipart envelope.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR on a large scan can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
